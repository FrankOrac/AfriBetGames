<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AfriBet Games</title>
  <desc id="desc">Play smart and track every ticket with clear game rules, demo play, and published results.</desc>
  <defs>
