      <g transform="translate(132)"><circle cx="25" cy="25" r="25" fill="#e3f4e9"/><text x="25" y="32" fill="#126b36">18</text></g>
      <g transform="translate(198)"><circle cx="25" cy="25" r="25" fill="#e3f4e9"/><text x="25" y="32" fill="#126b36">27</text></g>
      <g transform="translate(264)"><circle cx="25" cy="25" r="25" fill="#e3f4e9"/><text x="25" y="32" fill="#126b36">32</text></g>
