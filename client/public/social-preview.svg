    <text x="90" y="32" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="800" letter-spacing="-.8">AfriBet</text>
    <text x="91" y="56" fill="#a6b6ad" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="3">GAMES</text>
