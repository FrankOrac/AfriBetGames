    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1115" cy="-18" r="238" fill="#159447" opacity=".10"/>
  <circle cx="1100" cy="636" r="300" fill="#159447" opacity=".08"/>
  <path d="M0 534C209 467 376 505 565 630H0Z" fill="#159447" opacity=".07"/>

